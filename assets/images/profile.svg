<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Md Fardin Ahamed Profile Avatar">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="50%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#1f2330"/>
    </linearGradient>
    <linearGradient id="avatarFGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ece6"/>
    </linearGradient>
    <linearGradient id="avatarShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fc8a7d"/>
      <stop offset="100%" stop-color="#e0695b"/>
    </linearGradient>
    <filter id="avatarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="240" height="240" fill="url(#avatarBg)"/>
  <circle cx="120" cy="120" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Cyber shield watermark -->
  <path d="M 120 40 L 176 58 V 115 C 176 150 151 179 120 188 C 89 179 64 150 64 115 V 58 Z" fill="none" stroke="url(#avatarShield)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Geometric Monogram F -->
  <path d="M 88 70 H 152 C 155 70 158 73 158 76 V 86 C 158 89 155 92 152 92 H 110 V 106 H 140 C 143 106 146 109 146 112 V 120 C 146 123 143 126 140 126 H 110 V 146 C 110 149 107 152 104 152 H 94 C 91 152 88 149 88 146 V 70 Z" fill="url(#avatarFGrad)"/>

  <!-- Glowing Security Pulse -->
  <circle cx="152" cy="76" r="10" fill="#fc8a7d" filter="url(#avatarGlow)"/>
  <circle cx="120" cy="188" r="6" fill="#fc8a7d"/>
</svg>
