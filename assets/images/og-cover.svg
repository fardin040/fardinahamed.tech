<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Md Fardin Ahamed Portfolio Card">
  <defs>
    <!-- Dark Mode Gradient Background -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="50%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#141722"/>
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="coralGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fc8a7d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fc8a7d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#519dff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#519dff" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Badge Gradients -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#1f232d"/>
    </linearGradient>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ece6"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fc8a7d"/>
      <stop offset="100%" stop-color="#e0695b"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#coralGlow)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>

  <!-- Subtle Cyber Tech Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Outer Card Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="32" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Logo Group (Left Side) -->
  <g transform="translate(100, 225)" filter="url(#badgeShadow)">
    <rect width="180" height="180" rx="44" fill="url(#badgeBg)"/>
    <rect x="1" y="1" width="178" height="178" rx="43" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    
    <!-- Shield watermark -->
    <path d="M 90 32 L 136 48 V 90 C 136 118 116 141 90 148 C 64 141 44 118 44 90 V 48 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="6" stroke-opacity="0.3"/>
    
    <!-- Monogram F -->
    <path d="M 64 56 H 118 C 121 56 124 59 124 62 V 72 C 124 75 121 78 118 78 H 82 V 90 H 108 C 111 90 114 93 114 96 V 104 C 114 107 111 110 108 110 H 82 V 126 C 82 129 79 132 76 132 H 70 C 67 132 64 129 64 126 V 56 Z" fill="url(#fGrad)"/>
    
    <!-- Glowing Node -->
    <circle cx="118" cy="62" r="9" fill="#fc8a7d" filter="url(#pulseGlow)"/>
  </g>

  <!-- Text Group (Right Side) -->
  <g transform="translate(330, 240)">
    <!-- Label -->
    <text x="0" y="0" fill="#fc8a7d" font-size="20" font-family="'IBM Plex Mono', monospace" font-weight="600" letter-spacing="4">// PORTFOLIO &amp; WRITEUPS</text>
    
    <!-- Title -->
    <text x="0" y="65" fill="#f0ece6" font-size="64" font-family="'Funnel Display', 'DM Sans', sans-serif" font-weight="800" letter-spacing="-1">Md Fardin Ahamed<tspan fill="#fc8a7d">.</tspan></text>
    
    <!-- Subtitle -->
    <text x="0" y="115" fill="#a0aec0" font-size="28" font-family="'DM Sans', sans-serif" font-weight="500">Cybersecurity &amp; Networking Enthusiast</text>
    
    <!-- Description -->
    <text x="0" y="165" fill="#64748b" font-size="20" font-family="'DM Sans', sans-serif">Protocol analysis • Vulnerability labs • Embedded builds • Open source</text>

    <!-- Site URL Pill -->
    <g transform="translate(0, 205)">
      <rect width="210" height="42" rx="21" fill="#fc8a7d" fill-opacity="0.1" stroke="#fc8a7d" stroke-opacity="0.3"/>
      <text x="22" y="27" fill="#fc8a7d" font-size="16" font-family="'IBM Plex Mono', monospace" font-weight="600">fardinahamed.tech</text>
    </g>
  </g>
</svg>
