<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Md Fardin Ahamed Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="50%" stop-color="#151821"/>
      <stop offset="100%" stop-color="#1b1f2b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fc8a7d"/>
      <stop offset="100%" stop-color="#e0695b"/>
    </linearGradient>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ece6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark glassmorphic container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- Cyber shield watermark -->
  <path d="M 32 12 L 48 18 V 32 C 48 41.5 41.2 49.2 32 52 C 22.8 49.2 16 41.5 16 32 V 18 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Stylized Geometric 'F' Monogram -->
  <path d="M 23 20 H 42 C 43.1 20 44 20.9 44 22 C 44 23.1 43.1 24 42 24 H 29 V 30 H 38 C 39.1 30 40 30.9 40 32 C 40 33.1 39.1 34 38 34 H 29 V 43 C 29 44.1 28.1 45 27 45 H 25 C 23.9 45 23 44.1 23 43 V 20 Z" fill="url(#fGrad)"/>

  <!-- Glowing Security / Network Signal Pulse -->
  <circle cx="42" cy="22" r="3.5" fill="#fc8a7d" filter="url(#glow)"/>
  <circle cx="32" cy="52" r="2.5" fill="#fc8a7d"/>
</svg>
