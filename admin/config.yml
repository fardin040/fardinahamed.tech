backend:
  name: github
  repo: fardin040/fardinahamed.tech
  branch: main
  base_url: https://sveltia-oauth-worker.fardinahamed178.workers.dev
  auth_endpoint: auth/start

site_url: https://fardinahamed.tech
display_url: https://fardinahamed.tech
logo_url: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='bgGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%230f1117'/><stop offset='50%25' stop-color='%23151821'/><stop offset='100%25' stop-color='%231b1f2b'/></linearGradient><linearGradient id='shieldGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23fc8a7d'/><stop offset='100%25' stop-color='%23e0695b'/></linearGradient><linearGradient id='fGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23ffffff'/><stop offset='100%25' stop-color='%23f0ece6'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(%23bgGrad)'/><rect x='0.75' y='0.75' width='62.5' height='62.5' rx='15.25' fill='none' stroke='%23ffffff' stroke-opacity='0.12'/><path d='M 32 12 L 48 18 V 32 C 48 41.5 41.2 49.2 32 52 C 22.8 49.2 16 41.5 16 32 V 18 Z' fill='none' stroke='url(%23shieldGrad)' stroke-width='2' stroke-opacity='0.3'/><path d='M 23 20 H 42 C 43.1 20 44 20.9 44 22 C 44 23.1 43.1 24 42 24 H 29 V 30 H 38 C 39.1 30 40 30.9 40 32 C 40 33.1 39.1 34 38 34 H 29 V 43 C 29 44.1 28.1 45 27 45 H 25 C 23.9 45 23 44.1 23 43 V 20 Z' fill='url(%23fGrad)'/><circle cx='42' cy='22' r='3.5' fill='%23fc8a7d'/><circle cx='32' cy='52' r='2.5' fill='%23fc8a7d'/></svg>"
publish_mode: editorial_workflow

editor:
  preview: false

slug:
  encoding: ascii
  clean_accents: true

media_folder: assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - name: settings
    label: Site Settings
    files:
      - label: Profile
        name: profile
        file: content/settings/profile.md
        fields:
          - { label: Profile Image, name: profile_image, widget: image, required: false, hint: "Upload your profile picture here." }
          - { label: Profile Image Alt Text, name: profile_image_alt, widget: string, required: false, hint: "Accessibility text for profile image." }

      - label: Resume & CV
        name: resume
        file: content/settings/resume.md
        fields:
          - { label: Full Name, name: full_name, widget: string, default: "Md Fardin Ahamed" }
          - { label: Subtitle / Tagline, name: subtitle, widget: string, default: "Cybersecurity & Networking | ETE Student" }
          - { label: Phone, name: phone, widget: string, default: "+880 1782-998818" }
          - { label: Email, name: email, widget: string, default: "fardin.ahamed.ete@gmail.com" }
          - { label: Location, name: location, widget: string, default: "Chittagong, Bangladesh" }
          - { label: Website URL, name: website, widget: string, default: "https://fardinahamed.tech" }
          - { label: Upload PDF Resume File, name: pdf_file, widget: file, required: false, hint: "Upload your PDF resume document here." }
          - { label: Professional Summary, name: summary, widget: text }
          - label: Core Skills & Competencies
            name: skills
            widget: list
            field: { label: Skill, name: skill, widget: string }
          - { label: Languages, name: languages, widget: string, default: "Bengali (Native), English (Professional)" }
          - label: Education Entries
            name: education
            widget: list
            fields:
              - { label: Degree, name: degree, widget: string }
              - { label: Period, name: period, widget: string }
              - { label: Institution, name: institution, widget: string }
              - { label: Coursework & Notes, name: notes, widget: text }
          - label: Experience & Security Labs
            name: experience
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Tag / Category, name: tag, widget: string }
              - { label: Description, name: description, widget: text }

  - name: projects
    label: Projects
    folder: content/projects
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [title]
    view_filters:
      - { label: Featured, field: featured, pattern: true }
    media_folder: "../../assets/images/projects"
    public_folder: "/assets/images/projects"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string, hint: "Keep it short and clear (recommended under 60 characters)." }
      - { label: Description, name: description, widget: text, hint: "1-2 sentence summary for project cards." }
      - label: Technologies
        name: technologies
        widget: list
        field: { label: Technology, name: technology, widget: string }
      - { label: GitHub Link, name: github_link, widget: string, pattern: ['^https://github.com/.+', 'Must be a valid GitHub URL'] }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Image Alt Text, name: image_alt, widget: string, required: false, hint: "Describe the image for accessibility." }
      - { label: Featured Project, name: featured, widget: boolean, default: false, required: false }
      - { label: SEO Title, name: seo_title, widget: string, required: false, hint: "Optional. If empty, title is used." }
      - { label: Meta Description, name: meta_description, widget: text, required: false, hint: "Optional. Keep between 120-160 characters." }

  - name: blog
    label: Blog
    folder: content/blog
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} - {{title}}"
    sortable_fields: [date, title, category]
    view_filters:
      - { label: Networking, field: category, pattern: Networking }
      - { label: Security, field: category, pattern: Security }
      - { label: Tools, field: category, pattern: Tools }
      - { label: Linux, field: category, pattern: Linux }
      - { label: Learning, field: category, pattern: Learning }
    media_folder: "../../assets/images/blog"
    public_folder: "/assets/images/blog"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string, hint: "Recommended under 70 characters." }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - label: Category
        name: category
        widget: select
        options: [Networking, Security, Tools, Linux, Learning]
      - { label: Excerpt, name: excerpt, widget: text, hint: "Short summary shown in blog cards." }
      - { label: Cover Image, name: cover_image, widget: image, required: false }
      - { label: Cover Image Alt Text, name: cover_image_alt, widget: string, required: false }
      - { label: SEO Title, name: seo_title, widget: string, required: false, hint: "Optional. If empty, title is used." }
      - { label: Meta Description, name: meta_description, widget: text, required: false, hint: "Optional. Keep between 120-160 characters." }
      - { label: Featured Post, name: featured, widget: boolean, default: false, required: false }
      - { label: Content, name: body, widget: markdown }
